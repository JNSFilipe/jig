name: Validate skills

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install terminal test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux openssl perl
          command -v tmux bash openssl perl
      - name: Check distribution and versions
        run: python3 scripts/sync-plugin.py --check
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh
